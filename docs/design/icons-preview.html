<style>
:root{color-scheme:dark;--bg:#0d0b0a;--panel:#151210;--raised:#1e1916;--t0:#f6efe7;--t1:#cbbfb2;--t2:#8f8478;--accent:#f2a65a;--border:rgba(246,239,231,.1)}
:root[data-theme=light]{color-scheme:light;--bg:#fbf6ef;--panel:#f3ebe0;--raised:#ebe0d1;--t0:#1f1812;--t1:#4d4237;--t2:#7a6d60;--accent:#c8691d;--border:rgba(31,24,18,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t0);font:15px/1.45 system-ui,sans-serif;padding:32px;max-width:1100px;margin-inline:auto}
h1{font:600 28px/1.2 Georgia,serif;margin:0 0 4px}h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);margin:32px 0 12px}p{color:var(--t1);margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.t{background:var(--raised);color:var(--t0);border:1px solid var(--border);border-radius:999px;padding:8px 14px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.c{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px 12px;background:var(--panel);border:1px solid var(--border);border-radius:14px;color:var(--t0);cursor:pointer;font:inherit}
.c:hover{border-color:var(--accent);color:var(--accent)}.c svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.c span{font-size:11px;color:var(--t2)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}.b{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;color:var(--t2)}
.sizes{display:flex;gap:14px;align-items:center;color:var(--t0)}.sizes svg{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
