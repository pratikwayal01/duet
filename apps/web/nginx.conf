# Same-origin static + signaling: /api/* and WS /room/* proxy to the
# `signal` compose service so the web client needs no VITE_SIGNAL_URL.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://signal:8787;
    proxy_http_version 1.1;
  }

  location /room/ {
    proxy_pass http://signal:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
