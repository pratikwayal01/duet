<!doctype html>
<!-- Fake streaming page for adapter tests (PRD §7.3, §11.3). No external assets. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Duet fake player fixture</title>
  </head>
  <body>
    <main id="player">
      <video id="main" src="sample.mp4" width="640" height="360"></video>
      <div id="controls">
        <button id="play">Play</button>
        <button id="ep2">Episode 2 (SPA nav)</button>
      </div>
    </main>
    <div id="shadow-host"></div>
    <iframe id="same-origin" src="about:blank" title="ad-slot"></iframe>
    <script>
      // SPA-style navigation without reload.
      document.getElementById('ep2').addEventListener('click', () => {
        history.pushState({ ep: 2 }, '', '/watch/ep2');
      });
      // Video inside shadow DOM (adapter must still find it).
      const host = document.getElementById('shadow-host');
      const shadow = host.attachShadow({ mode: 'open' });
      const sv = document.createElement('video');
      sv.id = 'shadow-video';
      shadow.appendChild(sv);
      document.getElementById('play').addEventListener('click', () => {
        document.getElementById('main').play().catch(() => {});
      });
    </script>
  </body>
</html>
